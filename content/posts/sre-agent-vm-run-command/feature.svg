<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e3a"/><stop offset="1" stop-color="#0a5a6a"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="70" y="100" font-size="30" font-weight="600" fill="#7dd3fc">Azure SRE Agent · Run Command</text>
    <rect x="70" y="170" width="300" height="110" rx="14" fill="#12325c" stroke="#7dd3fc" stroke-width="2"/>
    <text x="220" y="215" font-size="26" fill="#e2f3ff" text-anchor="middle">SRE Agent</text>
    <text x="220" y="250" font-size="20" fill="#9fc3df" text-anchor="middle">managed identity</text>
    <line x1="370" y1="200" x2="760" y2="200" stroke="#f87171" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="565" y="185" font-size="22" fill="#fca5a5" text-anchor="middle">runCommand/action</text>
    <text x="790" y="212" font-size="40" fill="#f87171" font-weight="700">✕</text>
    <text x="850" y="210" font-size="22" fill="#fca5a5">SYSTEM / root</text>
    <line x1="370" y1="255" x2="790" y2="255" stroke="#7dd3fc" stroke-width="3" marker-end="url(#ar)"/>
    <text x="580" y="290" font-size="22" fill="#e2f3ff" text-anchor="middle">runCommands + runAsUser</text>
    <rect x="800" y="235" width="330" height="60" rx="12" fill="#0f4c4c" stroke="#34d399" stroke-width="2"/>
    <text x="965" y="273" font-size="24" fill="#a7f3d0" text-anchor="middle">✓ sre-agent (not admin)</text>
    <rect x="70" y="370" width="1060" height="170" rx="16" fill="#0c2a4a" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="420" font-size="26" font-weight="600" fill="#e2f3ff">RBAC: custom role</text>
    <text x="100" y="458" font-size="22" fill="#9fc3df">runCommands/read, runCommands/write · no runCommand/action</text>
    <text x="100" y="500" font-size="26" font-weight="600" fill="#e2f3ff">Azure Policy: Deny</text>
    <text x="100" y="530" font-size="22" fill="#9fc3df">runAsUser ∉ [sre-agent] · scriptUri · outputBlobUri</text>
  </g>
